<svg xmlns="http://www.w3.org/2000/svg" class="boomi-diagram" viewBox="0 0 960 460" role="img" aria-labelledby="order-routing-title order-routing-desc" style="min-width:720px"><title id="order-routing-title">Order routing</title><desc id="order-routing-desc">Configured order receipt routes valid orders to delivery and invalid orders to review. Evidence scope: configuration.</desc><defs><marker id="order-routing-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>.boomi-diagram{font-family:Arial,sans-serif;background:#fff;color:#172033}.node rect{fill:#edf7f7;stroke:#087f8c;stroke-width:2}.node text{text-anchor:middle;font-size:14px;fill:#172033}.state-label,.legend-item{font-size:14px;font-style:italic}.evidence-observed rect{stroke-width:4}.evidence-inferred rect,.evidence-unverified rect{stroke-dasharray:7 5}.evidence-historical rect{stroke:#667085}.edge{stroke:#087f8c;stroke-width:2;fill:none}.edge-label{font-size:14px;text-anchor:middle;fill:#172033}.legend-item{text-anchor:start;fill:#172033}</style><g id="order-routing-receive-route"><line class="edge" x1="210" y1="190" x2="395" y2="190" marker-end="url(#order-routing-arrow)"/></g><g id="order-routing-route-deliver"><line class="edge" x1="565" y1="168" x2="750" y2="120" marker-end="url(#order-routing-arrow)"/><text class="edge-label" x="657" y="136">valid</text></g><g id="order-routing-route-review"><line class="edge" x1="565" y1="222" x2="750" y2="290" marker-end="url(#order-routing-arrow)"/><text class="edge-label" x="657" y="248">invalid</text></g><g id="order-routing-receive" class="node source evidence-configured"><rect x="40" y="152" width="170" height="76" rx="10"/><text x="125" y="186">Receive order</text><text class="state-label" x="125" y="209">configured</text></g><g id="order-routing-route" class="node decision evidence-configured"><rect x="395" y="152" width="170" height="76" rx="10"/><text x="480" y="186">Validate order</text><text class="state-label" x="480" y="209">configured</text></g><g id="order-routing-deliver" class="node target evidence-configured"><rect x="750" y="60" width="170" height="76" rx="10"/><text x="835" y="94">Deliver order</text><text class="state-label" x="835" y="117">configured</text></g><g id="order-routing-review" class="node error evidence-unverified"><rect x="750" y="284" width="170" height="76" rx="10"/><text x="835" y="318">Manual review</text><text class="state-label" x="835" y="341">unverified</text></g><g aria-label="Evidence state legend"><text class="legend-item evidence-configured" x="40" y="428">configured</text><text class="legend-item evidence-unverified" x="220" y="428">unverified</text></g></svg>
